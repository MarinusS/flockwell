name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with the development commands in README.md.
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust and checking tools
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests (including doc tests)
        run: cargo test --workspace --locked

      - name: Run Clippy
        # Deny Clippy lints; keep existing compiler warnings visible.
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::all

      - name: Build domain for WebAssembly
        run: cargo build -p flockwell-domain --target wasm32-unknown-unknown --locked
